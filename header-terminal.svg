<svg xmlns="http://www.w3.org/2000/svg" width="860" height="215" viewBox="0 0 860 215" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace"><style>@keyframes fadeIn {
  0%   { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes typeClip {
  0%   { opacity: 0; clip-path: inset(0 100% 0 0); }
  5%   { opacity: 1; }
  100% { opacity: 1; clip-path: inset(0 0% 0 0); }
}
@keyframes blink {
  0%, 49%  { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.sys  { opacity: 0; animation: fadeIn 0.35s ease-out 0.05s both; }
.cmd  { opacity: 0; animation: typeClip 0.75s steps(36, end) 0.25s both; }
.hero { opacity: 0; animation: typeClip 0.70s steps(24, end) 0.85s both; }
.role { opacity: 0; animation: typeClip 0.90s steps(48, end) 1.40s both; }
.tags { opacity: 0; animation: fadeIn 0.45s ease-out 2.10s both; }
.cur  { animation: blink 1s steps(1, end) infinite; }
@media (prefers-reduced-motion: reduce) {
  .sys, .cmd, .hero, .role, .tags { opacity: 1 !important; transform: none !important; clip-path: none !important; animation: none !important; }
  .cur { animation: none !important; opacity: 1 !important; }
}</style><defs><linearGradient id="hdrbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1724"/><stop offset="1" stop-color="#090d14"/></linearGradient></defs><rect width="860" height="215" rx="12" fill="url(#hdrbg)"/><rect x="0.5" y="0.5" width="859" height="214" rx="12" fill="none" stroke="#22d3ee" stroke-opacity="0.45"/><line x1="0" y1="30.0" x2="860" y2="30.0" stroke="#22d3ee" stroke-opacity="0.45"/><circle cx="20.0" cy="15.0" r="5" fill="#ff5f56"/><circle cx="36.0" cy="15.0" r="5" fill="#ffbd2e"/><circle cx="52.0" cy="15.0" r="5" fill="#27c93f"/><text x="430.0" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">lastHunter956@github: ~/boot --system</text><text class="sys" x="24.0" y="58" font-size="12" fill="#7d8590">Linux lastHunter956-node 6.12.0-sec #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux</text><text class="cmd" x="24.0" y="82" font-size="14" fill="#7d8590"><tspan fill="#39d353">lastHunter956@github</tspan>:~$ whoami --verbose</text><text class="hero" x="24.0" y="122" font-size="30" font-weight="700" fill="#e6edf3">Jesús Martínez  <tspan font-size="18" fill="#22d3ee">@lastHunter956</tspan></text><text class="role" x="24.0" y="152" font-size="15" fill="#39d353">&gt; Systems Engineer · Data Scientist · AI &amp; InfoSec Builder</text><rect class="cur" x="553.7" y="139" width="9" height="16" fill="#22d3ee"/><g class="tags"><rect x="24.0" y="172" width="200.6" height="24" rx="5" fill="#161b22" stroke="#30363d"/><text x="34.0" y="188" font-size="12" fill="#e6edf3"><tspan fill="#39d353" font-weight="700">[LOC]</tspan> Cartagena, Colombia</text><rect x="234.6" y="172" width="193.4" height="24" rx="5" fill="#161b22" stroke="#30363d"/><text x="244.6" y="188" font-size="12" fill="#e6edf3"><tspan fill="#22d3ee" font-weight="700">[WEB]</tspan> jesusmartinez.tech</text><rect x="438.0" y="172" width="142.8" height="24" rx="5" fill="#161b22" stroke="#30363d"/><text x="448.0" y="188" font-size="12" fill="#e6edf3"><tspan fill="#f2cc60" font-weight="700">