name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every 24 hours at 00:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake-dark.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit and push snake SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No snake SVG changes to commit."
            exit 0
          fi
          git commit -m "chore: update snake contribution SVG [skip ci]"
          git pull --rebase origin main
          git push origin main
