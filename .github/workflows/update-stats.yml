name: Update Profile SVGs & Stats

on:
  schedule:
    - cron: "17 6 * * *" # Runs every 24 hours at 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch GitHub data and generate SVG panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/generate_profile.py

      - name: Commit and push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ header-terminal.svg ascii-portrait.svg neofetch-stats.svg languages-radar.svg activity-clock.svg cards/
          if git diff --cached --quiet; then
            echo "No SVG changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile SVGs and stats [skip ci]"
          git pull --rebase origin main
          git push origin main
